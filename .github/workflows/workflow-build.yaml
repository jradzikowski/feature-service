
name: Build feature-service image (backend + admin UI)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ] # Runs when someone targets a PR to master

jobs:
  test:
    runs-on: arc-runner-set-feature-service

    # ARC runner: point Maven/npm caches at the real runner home
    env:
      HOME: /home/runner
      MAVEN_OPTS: "-Duser.home=/home/runner"

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Builds the admin UI too (frontend-maven-plugin), so a PR verifies both backend and UI
      - name: Run tests
        run: ./mvnw test

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: arc-runner-set-feature-service

    env:
      HOME: /home/runner
      DOCKER_CONFIG: /home/runner/.docker
      MAVEN_OPTS: "-Duser.home=/home/runner"

    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.set-version.outputs.NEW_TAG }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version
        id: set-version
        shell: bash
        run: |
          git fetch --tags
          echo "tag from git: $(git describe --tags --abbrev=0 2>/dev/null)"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")
          echo "Current version: $LATEST_TAG"
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"

          echo "VERSION=$NEW_TAG" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG"

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # frontend-maven-plugin builds ui/ into /static/admin inside the JAR,
      # so the single JAR (and image) contains backend + admin panel
      - name: Build JAR (backend + admin UI)
        shell: bash
        env:
          MAVEN_OPTS: "-Duser.home=/home/runner -Dhttp.keepAlive=false -Dmaven.wagon.http.retryHandler.count=5"
        run: ./mvnw -e package -DskipTests

      - name: Build and push Docker image
        shell: bash
        run: |
          IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE_NAME }}
          docker build -t $IMAGE:${{ env.NEW_TAG }} -t $IMAGE:latest .
          docker push $IMAGE:${{ env.NEW_TAG }}
          docker push $IMAGE:latest

      - name: Push Version Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: arc-runner-set-feature-service

    env:
      HOME: /home/runner

    steps:
      - name: Deploy to Kubernetes
        run: |
          rm -f /home/runner/.kube/config
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi
          kubectl set image deployment/feature-service \
            feature-service=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE_NAME }}:${{ needs.build.outputs.version }} \
            -n internal-services
