server.port=8080
management.server.port=9090

spring.datasource.url=jdbc:postgresql://${K_DB_HOST}:${K_DB_PORT}/${K_DB_DATABASE}?stringtype=unspecified
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${K_DB_USERNAME}
spring.datasource.password=${K_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Hardened session cookie behind TLS ingress
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ECS JSON logs for the cluster log pipeline
logging.structured.format.console=ecs
logging.level.com.awesomesoft.features=INFO

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
