spring.application.name=feature-service
server.port=11230

# H2 in PostgreSQL compatibility mode so the very same Flyway migrations run on dev H2 and on
# Postgres — unlike audit there is no ddl-auto/create-drop split, the schema always comes from
# db/migration (single source of truth, no drift between dev and prod schemas).
# NON_KEYWORDS=VALUE: flag_overrides.value is a reserved word in H2 but a legal identifier in Postgres.
spring.datasource.url=jdbc:h2:mem:featuredb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Response compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Admin panel session
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FEATURES_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Bootstrap admin account — created at startup only when the admin_users table is empty.
features.admin.initial-username=${FEATURES_ADMIN_USERNAME:admin}
features.admin.initial-password=${FEATURES_ADMIN_PASSWORD:admin-change-me}

# Bootstrap evaluation token — lets the first consumer call /evaluate before any token has been
# generated in the panel. Maps to the application slug below; blank disables the bootstrap token.
features.evaluation.bootstrap-token=${FEATURES_BOOTSTRAP_TOKEN:}
features.evaluation.bootstrap-application=${FEATURES_BOOTSTRAP_APPLICATION:audit}

# Login rate limiting for the admin panel — per client IP, fixed window (same knobs as audit).
features.security.login-rate-limit.max-attempts=10
features.security.login-rate-limit.window-seconds=60

# Observability — actuator on a separate management port (cluster-internal, not routed by ingress).
management.server.port=9091
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# SpringDoc OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.com.awesomesoft.features=DEBUG
